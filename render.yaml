# Déploiement Render (Blueprint) : site statique assemblé dans dist/ à chaque push sur la branche principale.
# Les en-têtes reprennent ceux de netlify.toml ; seul l'envoi du formulaire vers Formspree est ajouté.
services:
  - type: web
    name: lbv-production
    runtime: static
    buildCommand: node tools/build-content.mjs && node tools/build-dist.mjs
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://raw.githubusercontent.com; media-src 'self' blob:; connect-src 'self' https://formspree.io https://api.github.com; form-action 'self' mailto: https://formspree.io; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /images/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /audio/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /css/*
        name: Cache-Control
        value: "public, max-age=604800"
      - path: /js/*
        name: Cache-Control
        value: "public, max-age=604800"
      - path: /index.html
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"
